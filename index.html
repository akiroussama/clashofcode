<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Clash Of Code - 32 Étudiants</title>
  <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@600;700&family=Plus+Jakarta+Sans:wght@500;600;700;800&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-gradient: radial-gradient(circle at 20% 20%, #34527a 0%, #464964 48%, #694666 100%);
      --text-light: #ffffff;
      --accent-green: #00e676;
      --gold-glow: #ffd700;
    }

    body.dark-mode {
      --bg-gradient: radial-gradient(circle at 20% 20%, #0f172a 0%, #1e1b4b 52%, #2e1035 100%);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
    }

    body {
      min-height: 100vh;
      background: var(--bg-gradient);
      font-family: 'Plus Jakarta Sans', sans-serif;
      color: var(--text-light);
      padding: 22px 20px 60px;
      transition: background 0.5s ease;
      overflow-x: hidden;
    }

    body::before {
      content: "";
      position: fixed;
      inset: 0;
      background-image: radial-gradient(rgba(255, 255, 255, 0.05) 1px, transparent 1px);
      background-size: 28px 28px;
      pointer-events: none;
      z-index: 0;
    }

    #confettiCanvas {
      position: fixed;
      inset: 0;
      width: 100vw;
      height: 100vh;
      pointer-events: none;
      z-index: 999;
    }

    /* --- HEADER --- */
    header {
      position: relative;
      z-index: 2;
      text-align: center;
      margin-bottom: 28px;
    }

    .title-wrapper {
      display: inline-flex;
      align-items: center;
      gap: 16px;
      margin-bottom: 12px;
    }

    h1 {
      font-family: 'Fredoka', cursive, sans-serif;
      font-size: 2.3rem;
      letter-spacing: 1px;
      background: linear-gradient(180deg, #ffffff 20%, #d4dce8 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      filter: drop-shadow(0 4px 10px rgba(0, 0, 0, 0.35));
    }

    .flag-icon {
      font-size: 2rem;
      filter: drop-shadow(0 0 10px rgba(255, 215, 0, 0.45));
      animation: wave 2.6s infinite ease-in-out;
    }

    @keyframes wave {
      0%, 100% { transform: rotate(-8deg) scale(1); }
      50% { transform: rotate(8deg) scale(1.06); }
    }

    .top-bar {
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 10px;
    }

    .btn-projects {
      background: #f5f6fa;
      color: #2f3640;
      border: none;
      padding: 6px 14px;
      border-radius: 6px;
      font-weight: 700;
      font-size: 0.76rem;
      box-shadow: 0 3px 10px rgba(0, 0, 0, 0.2);
      cursor: pointer;
    }

    .btn-circle {
      height: 28px;
      padding: 0 10px;
      border-radius: 14px;
      background: rgba(255, 255, 255, 0.14);
      border: 1px solid rgba(255, 255, 255, 0.12);
      color: #fff;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 5px;
      font-size: 0.78rem;
      font-weight: 600;
      cursor: pointer;
      backdrop-filter: blur(6px);
      transition: background 0.2s ease, transform 0.2s ease;
    }

    .btn-circle:hover {
      background: rgba(255, 255, 255, 0.24);
      transform: translateY(-1px);
    }

    /* --- RACE CONTAINER (32 LIGNES) --- */
    .race-container {
      position: relative;
      z-index: 2;
      max-width: 1480px;
      margin: 0 auto;
      display: flex;
      flex-direction: column;
      gap: 18px;
    }

    .lane-row {
      display: flex;
      align-items: center;
      gap: 15px;
      position: relative;
    }

    /* --- STUDENT CARD --- */
    .student-card {
      width: 196px;
      min-width: 196px;
      height: 56px;
      background: linear-gradient(110deg, #ff6243 0%, #833ab4 55%, #2b3270 100%);
      border-radius: 14px;
      display: flex;
      align-items: center;
      padding: 8px 12px;
      gap: 10px;
      box-shadow: 
        0 8px 18px rgba(0, 0, 0, 0.35),
        inset 0 1px 1px rgba(255, 255, 255, 0.35);
      border: 1px solid rgba(255, 255, 255, 0.16);
      transition: all 0.3s cubic-bezier(0.22, 1, 0.36, 1);
      position: relative;
      cursor: pointer;
    }

    .student-card.is-moving {
      transform: scale(1.03) translateX(3px);
      box-shadow: 
        0 0 18px rgba(255, 165, 2, 0.55),
        inset 0 1px 2px rgba(255, 255, 255, 0.6);
      border-color: rgba(255, 215, 0, 0.65);
    }

    .student-card.victory-card {
      background: linear-gradient(110deg, #f1c40f 0%, #ff6b00 50%, #00e676 100%);
      border-color: #ffffff;
      animation: cardVictoryPulse 0.6s infinite alternate ease-in-out;
    }

    @keyframes cardVictoryPulse {
      0% { transform: scale(1.03); box-shadow: 0 0 22px rgba(255, 215, 0, 0.8), 0 0 40px rgba(0, 230, 118, 0.4); }
      100% { transform: scale(1.07); box-shadow: 0 0 35px rgba(255, 215, 0, 1), 0 0 60px rgba(0, 230, 118, 0.8); }
    }

    .rank-badge {
      position: absolute;
      top: -7px;
      left: -7px;
      background: #1e222d;
      color: #fff;
      font-size: 0.62rem;
      font-weight: 800;
      padding: 1px 6px;
      border-radius: 7px;
      border: 1.5px solid rgba(255, 255, 255, 0.25);
      box-shadow: 0 3px 6px rgba(0,0,0,0.4);
      transition: all 0.3s ease;
    }

    .rank-badge.rank-1 {
      background: linear-gradient(135deg, #ffd700, #ff9800);
      color: #111;
      border-color: #fff;
      box-shadow: 0 0 12px rgba(255, 215, 0, 0.6);
    }

    .rank-badge.rank-2 {
      background: linear-gradient(135deg, #e0e0e0, #9e9e9e);
      color: #111;
      border-color: #fff;
      box-shadow: 0 0 10px rgba(255, 255, 255, 0.5);
    }

    .avatar {
      width: 34px;
      height: 34px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 800;
      font-size: 0.82rem;
      color: #fff;
      box-shadow: 0 3px 6px rgba(0, 0, 0, 0.35), inset 0 1px 2px rgba(255,255,255,0.4);
      flex-shrink: 0;
    }

    .student-info {
      display: flex;
      flex-direction: column;
      overflow: hidden;
      flex: 1;
    }

    .student-name {
      font-weight: 800;
      font-size: 0.8rem;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      display: flex;
      align-items: center;
      gap: 4px;
      text-shadow: 0 1px 3px rgba(0,0,0,0.4);
    }

    .crown {
      font-size: 0.72rem;
    }

    .student-stats {
      font-size: 0.68rem;
      color: rgba(255, 255, 255, 0.85);
      margin-top: 2px;
      font-weight: 600;
    }

    .student-stats .pct {
      color: var(--accent-green);
      font-weight: 800;
      text-shadow: 0 0 8px rgba(0, 230, 118, 0.3);
    }

    .student-card.victory-card .student-stats .pct {
      color: #fff;
      text-shadow: 0 0 10px #000;
    }

    /* --- TRACK / ROAD --- */
    .track-wrapper {
      flex: 1;
      position: relative;
      height: 62px;
      display: flex;
      align-items: center;
    }

    .start-gate {
      position: relative;
      z-index: 4;
      display: flex;
      flex-direction: column;
      align-items: center;
      margin-right: -11px;
    }

    .traffic-light {
      width: 20px;
      height: 46px;
      background: #181a1f;
      border: 2px solid #57606f;
      border-radius: 10px;
      display: flex;
      flex-direction: column;
      justify-content: space-evenly;
      align-items: center;
      padding: 2px 0;
      transform: skewX(-24deg);
      box-shadow: 4px 5px 10px rgba(0,0,0,0.55);
    }

    .bulb {
      width: 7px;
      height: 7px;
      border-radius: 50%;
    }
    .bulb.red { background: #ff4757; opacity: 0.35; }
    .bulb.yellow { background: #ffa502; opacity: 0.35; }
    .bulb.green { background: #2ed573; box-shadow: 0 0 8px #2ed573; }

    .gate-label {
      font-size: 0.5rem;
      font-weight: 800;
      letter-spacing: 0.8px;
      margin-top: 3px;
      color: rgba(255,255,255,0.7);
    }

    .road {
      flex: 1;
      height: 56px;
      background: linear-gradient(180deg, #2b2d31 0%, #43464c 42%, #26282c 100%);
      border-radius: 32px 24px 12px 12px;
      position: relative;
      box-shadow: 
        0 12px 22px rgba(0, 0, 0, 0.45),
        inset 0 5px 10px rgba(0, 0, 0, 0.65),
        inset 0 -2px 5px rgba(255, 255, 255, 0.08);
      border-top: 3px solid #4a4d54;
      transition: box-shadow 0.4s ease, border-color 0.4s ease;
      overflow: visible;
    }

    .road.road-victory {
      border-top-color: #ffd700;
      box-shadow: 
        0 0 30px rgba(255, 215, 0, 0.55),
        0 0 55px rgba(0, 230, 118, 0.3),
        inset 0 0 20px rgba(255, 215, 0, 0.35);
    }

    .road::before {
      content: "";
      position: absolute;
      top: 0;
      left: 63%;
      width: 48px;
      height: 100%;
      background: linear-gradient(90deg, transparent, rgba(255,255,255,0.07), transparent);
      transform: skewX(-28deg);
      pointer-events: none;
    }

    .progress-trail {
      position: absolute;
      left: 38px;
      top: 50%;
      transform: translateY(-60%);
      height: 5px;
      border-radius: 5px;
      background: linear-gradient(90deg, rgba(46, 213, 115, 0.05), rgba(0, 230, 118, 0.5));
      box-shadow: 0 0 10px rgba(0, 230, 118, 0.25);
      transition: width 1.15s cubic-bezier(0.22, 1, 0.36, 1), background 0.3s ease, height 0.3s ease;
      pointer-events: none;
      z-index: 1;
    }

    .road.road-victory .progress-trail {
      height: 8px;
      background: linear-gradient(90deg, #00e676, #00e5ff, #ffd700, #ff3d00, #ffd700);
      background-size: 200% 100%;
      animation: rainbowTrail 1s linear infinite;
      box-shadow: 0 0 20px rgba(255, 215, 0, 0.9);
    }

    @keyframes rainbowTrail {
      0% { background-position: 0% 50%; }
      100% { background-position: 200% 50%; }
    }

    .curb {
      position: absolute;
      bottom: 0;
      left: 10px;
      right: 10px;
      height: 6px;
      border-radius: 0 0 7px 7px;
      background: repeating-linear-gradient(
        90deg,
        #ced6e0 0px,
        #ced6e0 32px,
        #d63031 32px,
        #d63031 64px
      );
      border-top: 1.5px solid #95a5a6;
      z-index: 3;
    }

    /* --- 10 CHECKPOINTS --- */
    .checkpoints-layer {
      position: absolute;
      top: 0;
      bottom: 6px;
      left: 38px;
      right: 52px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      pointer-events: none;
    }

    .checkpoints-layer::before {
      content: "";
      position: absolute;
      left: 0;
      right: 0;
      top: 50%;
      height: 1.5px;
      transform: translateY(-50%);
      background: repeating-linear-gradient(
        90deg,
        rgba(255,255,255,0.07) 0px,
        rgba(255,255,255,0.07) 10px,
        transparent 10px,
        transparent 20px
      );
      z-index: 1;
    }

    .cp-marker {
      position: relative;
      z-index: 2;
      width: 17px;
      height: 17px;
      border-radius: 50%;
      background: #1b1d22;
      border: 1.5px solid rgba(255, 255, 255, 0.16);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 0.54rem;
      font-weight: 800;
      color: rgba(255, 255, 255, 0.38);
      transition: all 0.4s ease;
      pointer-events: auto;
      cursor: default;
    }

    .cp-marker.passed {
      background: rgba(0, 230, 118, 0.18);
      border-color: #00e676;
      color: #b9f6ca;
      box-shadow: 0 0 8px rgba(0, 230, 118, 0.35);
    }

    .cp-marker.current {
      background: rgba(255, 193, 7, 0.18);
      border-color: #ffc107;
      color: #ffe082;
      transform: scale(1.15);
      box-shadow: 0 0 10px rgba(255, 193, 7, 0.5);
    }

    .road.road-victory .cp-marker.passed {
      background: #ffd700;
      border-color: #ffffff;
      color: #111;
      box-shadow: 0 0 14px #ffd700;
      transform: scale(1.12);
    }

    .cp-marker:hover::before {
      content: attr(data-title);
      position: absolute;
      bottom: 24px;
      background: rgba(15, 18, 26, 0.96);
      color: #fff;
      font-size: 0.68rem;
      font-weight: 600;
      padding: 4px 9px;
      border-radius: 7px;
      white-space: nowrap;
      border: 1px solid rgba(255,255,255,0.18);
      box-shadow: 0 6px 16px rgba(0,0,0,0.5);
      z-index: 40;
    }

    /* --- VEHICLES & DOPAMINE EFFECTS --- */
    .vehicle-track-area {
      position: absolute;
      top: 0;
      bottom: 6px;
      left: 38px;
      right: 52px;
      pointer-events: none;
    }

    .vehicle-wrapper {
      position: absolute;
      top: 50%;
      transform: translate(-50%, -54%);
      width: 74px;
      height: 42px;
      z-index: 6;
      transition: left 1.15s cubic-bezier(0.22, 1, 0.36, 1), transform 0.3s ease;
      filter: drop-shadow(0 6px 5px rgba(0, 0, 0, 0.6));
      pointer-events: auto;
      cursor: pointer;
    }

    .vehicle-wrapper.boosting {
      transform: translate(-50%, -58%) rotate(-3.5deg) scale(1.06);
    }

    .vehicle-wrapper.celebrating {
      z-index: 25;
      filter: drop-shadow(0 0 16px #ffd700) drop-shadow(0 0 28px #00e676);
      animation: victoryCarBounce 0.42s infinite alternate cubic-bezier(0.34, 1.56, 0.64, 1);
    }

    @keyframes victoryCarBounce {
      0% { transform: translate(-50%, -52%) scale(1.08) rotate(0deg); }
      100% { transform: translate(-50%, -80%) scale(1.2) rotate(-6deg); }
    }

    .victory-spotlight {
      position: absolute;
      bottom: -6px;
      left: 50%;
      transform: translateX(-50%) scaleY(0);
      transform-origin: bottom center;
      width: 120px;
      height: 135px;
      background: radial-gradient(ellipse at bottom, rgba(255, 215, 0, 0.68) 0%, rgba(0, 230, 118, 0.28) 45%, transparent 75%);
      clip-path: polygon(28% 0%, 72% 0%, 100% 100%, 0% 100%);
      pointer-events: none;
      opacity: 0;
      transition: all 0.35s ease;
      z-index: -1;
      mix-blend-mode: screen;
    }

    .vehicle-wrapper.celebrating .victory-spotlight {
      opacity: 1;
      transform: translateX(-50%) scaleY(1);
      animation: spotlightPulse 0.6s infinite alternate ease-in-out;
    }

    @keyframes spotlightPulse {
      from { filter: brightness(1); width: 115px; }
      to { filter: brightness(1.35); width: 145px; }
    }

    .shockwave-ring {
      position: absolute;
      top: 50%;
      left: 50%;
      width: 18px;
      height: 18px;
      border-radius: 50%;
      border: 3px solid #ffd700;
      transform: translate(-50%, -50%) scale(0);
      opacity: 0;
      pointer-events: none;
      box-shadow: 0 0 18px #ffd700, inset 0 0 12px #00e676;
    }

    .vehicle-wrapper.celebrating .shockwave-ring {
      animation: shockwaveExpand 1.1s infinite ease-out;
    }

    @keyframes shockwaveExpand {
      0% { transform: translate(-50%, -50%) scale(0.4); opacity: 1; }
      100% { transform: translate(-50%, -50%) scale(5.2); opacity: 0; }
    }

    .headlight-beam {
      position: absolute;
      right: -32px;
      bottom: 4px;
      width: 42px;
      height: 16px;
      background: linear-gradient(90deg, rgba(255, 249, 196, 0.45), transparent);
      clip-path: polygon(0 35%, 100% 0, 100% 100%, 0 70%);
      pointer-events: none;
      opacity: 0.55;
      transition: opacity 0.3s ease, width 0.3s ease;
    }

    .vehicle-wrapper.boosting .headlight-beam,
    .vehicle-wrapper.celebrating .headlight-beam {
      opacity: 1;
      width: 72px;
      background: linear-gradient(90deg, rgba(255, 215, 0, 0.9), rgba(0, 230, 118, 0.4), transparent);
    }

    .nitro-flame {
      position: absolute;
      left: -13px;
      bottom: 8px;
      width: 18px;
      height: 8px;
      background: linear-gradient(90deg, transparent, #ff5722, #ffeb3b, #00e5ff);
      border-radius: 50% 0 0 50%;
      filter: blur(1px);
      opacity: 0;
      transform: scaleX(0.4);
      transform-origin: right center;
      transition: all 0.2s ease;
    }

    .vehicle-wrapper.boosting .nitro-flame,
    .vehicle-wrapper.celebrating .nitro-flame {
      opacity: 1;
      transform: scaleX(1.5);
      animation: flicker 0.1s infinite alternate;
    }

    @keyframes flicker {
      from { transform: scaleX(1.2) scaleY(0.9); }
      to { transform: scaleX(1.7) scaleY(1.25); }
    }

    .activity-toast {
      position: absolute;
      top: -20px;
      left: 50%;
      transform: translateX(-50%) translateY(6px);
      background: rgba(16, 20, 28, 0.92);
      border: 1px solid rgba(0, 230, 118, 0.6);
      color: #69f0ae;
      font-size: 0.58rem;
      font-weight: 800;
      padding: 2px 7px;
      border-radius: 8px;
      white-space: nowrap;
      opacity: 0;
      transition: all 0.25s ease;
      box-shadow: 0 4px 10px rgba(0,0,0,0.4);
    }

    .vehicle-wrapper.boosting .activity-toast {
      opacity: 1;
      transform: translateX(-50%) translateY(0);
    }

    .vehicle-wrapper.celebrating .activity-toast {
      opacity: 1;
      top: -30px;
      background: linear-gradient(135deg, #ffd700, #ff9100);
      color: #111;
      font-size: 0.7rem;
      font-weight: 900;
      padding: 3px 10px;
      border: 2px solid #ffffff;
      box-shadow: 0 0 18px rgba(255, 215, 0, 0.9);
      transform: translateX(-50%) translateY(0) scale(1.08);
    }

    .vehicle-svg {
      width: 100%;
      height: 100%;
      animation: engineIdling 0.45s infinite alternate ease-in-out;
    }

    @keyframes engineIdling {
      0% { transform: translateY(0px); }
      100% { transform: translateY(-1.2px); }
    }

    .siren-red { animation: blinkRed 0.35s infinite alternate; }
    .siren-blue { animation: blinkBlue 0.35s infinite alternate-reverse; }

    @keyframes blinkRed {
      from { fill: #ff1744; filter: drop-shadow(0 0 6px #ff1744); }
      to { fill: #5c0011; }
    }
    @keyframes blinkBlue {
      from { fill: #00b0ff; filter: drop-shadow(0 0 6px #00b0ff); }
      to { fill: #00294d; }
    }

    .exhaust {
      position: absolute;
      left: -5px;
      bottom: 8px;
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: rgba(220, 220, 220, 0.4);
      animation: puff 0.95s infinite ease-out;
    }

    @keyframes puff {
      0% { transform: translate(0, 0) scale(0.6); opacity: 0.65; }
      100% { transform: translate(-18px, -6px) scale(2); opacity: 0; }
    }

    /* --- FINISH LINE --- */
    .finish-gate {
      position: relative;
      z-index: 4;
      margin-left: -15px;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .checkered-strip {
      width: 22px;
      height: 44px;
      background-color: #fff;
      background-image: 
        linear-gradient(45deg, #111 25%, transparent 25%), 
        linear-gradient(-45deg, #111 25%, transparent 25%), 
        linear-gradient(45deg, transparent 75%, #111 75%), 
        linear-gradient(-45deg, transparent 75%, #111 75%);
      background-size: 10px 10px;
      background-position: 0 0, 0 5px, 5px -5px, -5px 0;
      transform: skewX(24deg);
      border-radius: 4px;
      box-shadow: -3px 4px 10px rgba(0,0,0,0.5);
      border: 1.5px solid #222;
      transition: all 0.3s ease;
    }

    .finish-gate.gate-victory .checkered-strip {
      border-color: #ffd700;
      box-shadow: 0 0 22px #ffd700, 0 0 35px #00e676;
      transform: skewX(24deg) scale(1.12);
    }
  </style>
</head>
<body>

  <canvas id="confettiCanvas"></canvas>

  <header>
    <div class="title-wrapper">
      <span class="flag-icon">🏁</span>
      <h1>Clash Of Code</h1>
      <span class="flag-icon">🏁</span>
    </div>

    <div class="top-bar">
      <button class="btn-projects" id="btnReplay" title="Relancer la course des 32 étudiants">All Projects (32)</button>
      <button class="btn-circle" id="btnRecordVideo" title="Enregistrer en vidéo jusqu'aux 2 gagnants">🎬</button>
      <button class="btn-circle" id="btnTheme" title="Changer le thème">🌙</button>
    </div>
  </header>

  <main class="race-container" id="raceContainer"></main>

  <script>
    const COURSE_CHECKPOINTS = [
      "CP 1 : Algorithmique & Bases",
      "CP 2 : Structures de Contrôle",
      "CP 3 : Fonctions & Portée",
      "CP 4 : Structures de Données",
      "CP 5 : Programmation Orientée Objet",
      "CP 6 : Manipulation DOM & Events",
      "CP 7 : Asynchronisme & Fetch API",
      "CP 8 : Architecture & Modules",
      "CP 9 : Tests Unitaires & Perf",
      "CP 10 : Déploiement Projet Final"
    ];

    const ACTIVITY_MESSAGES = [
      "⚡ Push validé !",
      "🔥 Checkpoint franchi !",
      "💻 Test 100% OK",
      "🚀 Boost !",
      "✅ PR Mergée !"
    ];

    let winnersCount = 0;
    const MAX_WINNERS = 2; // S'arrête après 2 gagnants !
    let raceFinished = false;

    // 32 Étudiants en France (~40% Français, ~60% Internationaux : Arabes/Maghrébins, Africains, Asiatiques)

              <rect x="70" y="16" width="16" height="9" rx="1.5" fill="#00a8ff"/>
              <circle cx="26" cy="40" r="8" fill="#111" stroke="#000" stroke-width="2"/>
              <circle cx="26" cy="40" r="3.5" fill="#ddd"/>
              <circle cx="74" cy="40" r="8" fill="#111" stroke="#000" stroke-width="2"/>
              <circle cx="74" cy="40" r="3.5" fill="#ddd"/>
            </svg>`;
      }
    }

    // --- MOTEUR DE CONFETTIS & D'ÉTOILES ---
    const canvas = document.getElementById("confettiCanvas");
    const ctx = canvas.getContext("2d");
    let particles = [];
    let animFrameId = null;

    function resizeCanvas() {
      canvas.width = window.innerWidth;
      canvas.height = window.innerHeight;
    }
    window.addEventListener("resize", resizeCanvas);
    resizeCanvas();

    const DOPAMINE_COLORS = [
      "#FFD700", "#00E676", "#FF1744", "#00E5FF",
      "#FF9100", "#D500F9", "#FFFF00", "#FFFFFF"
    ];

    function spawnConfettiAtCar(vehicleEl) {
      if (!vehicleEl) return;
      const rect = vehicleEl.getBoundingClientRect();
      const originX = rect.left + rect.width * 0.5;
      const originY = rect.top + rect.height * 0.35;

      for (let i = 0; i < 90; i++) {
        const angle = -Math.PI / 2 + (Math.random() - 0.5) * 2.3;
        const speed = 4 + Math.random() * 11;
        const shapeType = Math.random() < 0.28 ? "star" : (Math.random() < 0.5 ? "rect" : "circle");

        particles.push({
          x: originX + (Math.random() - 0.5) * 30,
          y: originY + (Math.random() - 0.5) * 15,
          vx: Math.cos(angle) * speed,
          vy: Math.sin(angle) * speed - 2,
          size: 5 + Math.random() * 6,
          color: DOPAMINE_COLORS[Math.floor(Math.random() * DOPAMINE_COLORS.length)],
          rotation: Math.random() * 360,
          rotationSpeed: (Math.random() - 0.5) * 14,
          gravity: 0.22 + Math.random() * 0.1,
          drag: 0.985,
          alpha: 1,
          decay: 0.007 + Math.random() * 0.008,
          shape: shapeType
        });
      }

      if (!animFrameId) {
        animateConfetti();
      }
    }

    function drawStar(cx, cy, spikes, outerRadius, innerRadius) {
      let rot = Math.PI / 2 * 3;
      let x = cx;
      let y = cy;
      const step = Math.PI / spikes;
      ctx.beginPath();
      ctx.moveTo(cx, cy - outerRadius);
      for (let i = 0; i < spikes; i++) {
        x = cx + Math.cos(rot) * outerRadius;
        y = cy + Math.sin(rot) * outerRadius;
        ctx.lineTo(x, y);
        rot += step;
        x = cx + Math.cos(rot) * innerRadius;
        y = cy + Math.sin(rot) * innerRadius;
        ctx.lineTo(x, y);
        rot += step;
      }
      ctx.lineTo(cx, cy - outerRadius);
      ctx.closePath();
      ctx.fill();
    }

    function animateConfetti() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);

      for (let i = particles.length - 1; i >= 0; i--) {
        const p = particles[i];
        p.vx *= p.drag;
        p.vy *= p.drag;
        p.vy += p.gravity;
        p.x += p.vx;
        p.y += p.vy;
        p.rotation += p.rotationSpeed;
        p.alpha -= p.decay;

        if (p.alpha <= 0) {
          particles.splice(i, 1);
          continue;
        }

        ctx.save();
        ctx.globalAlpha = Math.max(0, p.alpha);
        ctx.translate(p.x, p.y);
        ctx.rotate((p.rotation * Math.PI) / 180);
        ctx.fillStyle = p.color;
        ctx.shadowColor = p.color;
        ctx.shadowBlur = 8;

        if (p.shape === "rect") {
          ctx.fillRect(-p.size / 2, -p.size / 2, p.size, p.size * 0.6);
        } else if (p.shape === "circle") {
          ctx.beginPath();
          ctx.arc(0, 0, p.size * 0.45, 0, Math.PI * 2);
          ctx.fill();
        } else {
          drawStar(0, 0, 5, p.size * 0.7, p.size * 0.35);
        }
        ctx.restore();
      }

      if (particles.length > 0) {
        animFrameId = requestAnimationFrame(animateConfetti);
      } else {
        animFrameId = null;
      }
    }

    const raceContainer = document.getElementById("raceContainer");

    function getVehicleLeftPercent(progress) {
      const clamped = Math.max(1, Math.min(10, progress));
      return ((clamped - 1) / 9) * 100;
    }

    function getRankings() {
      const sorted = [...students].sort((a, b) => {
        if (a.winOrder && b.winOrder) return a.winOrder - b.winOrder;
        if (a.winOrder) return -1;
        if (b.winOrder) return 1;
        return b.progress - a.progress;
      });
      const rankMap = {};
      sorted.forEach((s, idx) => {
        rankMap[s.id] = idx + 1;
      });
      return rankMap;
    }

    function renderTracks() {
      raceContainer.innerHTML = "";
      const ranks = getRankings();

      students.forEach((student) => {
        const currentCpInt = Math.floor(student.progress);
        const pct = ((student.progress / 10) * 100).toFixed(1);
        const leftPct = getVehicleLeftPercent(student.progress);
        const rank = ranks[student.id];

        let checkpointsHTML = "";
        for (let cp = 1; cp <= 10; cp++) {
          let stateClass = "";
          if (cp <= currentCpInt) stateClass = "passed";
          else if (cp === currentCpInt + 1) stateClass = "current";

          checkpointsHTML += `
            <div class="cp-marker ${stateClass}" 
                 id="cp-${student.id}-${cp}" 
                 data-title="${COURSE_CHECKPOINTS[cp - 1]}">
              ${cp}
            </div>`;
        }

        const row = document.createElement("div");
        row.className = "lane-row";
        row.innerHTML = `
          <div class="student-card" id="card-${student.id}" onclick="advanceSingleStudent('${student.id}')">
            <div class="rank-badge ${rank === 1 ? 'rank-1' : (rank === 2 ? 'rank-2' : '')}" id="rank-${student.id}">#${rank}</div>
            <div class="avatar" style="background: ${student.avatarColor}">${student.initial}</div>
            <div class="student-info">
              <div class="student-name" title="${student.name}">
                ${student.name} <span class="crown" id="crown-${student.id}">${rank === 1 ? '👑' : '⚡'}</span>
              </div>
              <div class="student-stats" id="stats-${student.id}">
                ${currentCpInt}/10 (<span class="pct">${pct}%</span>)
              </div>
            </div>
          </div>

          <div class="track-wrapper">
            <div class="start-gate">
              <div class="traffic-light">
                <span class="bulb red"></span>
                <span class="bulb yellow"></span>
                <span class="bulb green"></span>
              </div>
              <span class="gate-label">START</span>
            </div>

            <div class="road" id="road-${student.id}">
              <div class="progress-trail" id="trail-${student.id}" style="width: calc(${leftPct}% - 10px);"></div>

              <div class="checkpoints-layer">
                ${checkpointsHTML}
              </div>

              <div class="vehicle-track-area">
                <div class="vehicle-wrapper" id="vehicle-${student.id}" style="left: ${leftPct}%;" onclick="advanceSingleStudent('${student.id}')">
                  <div class="victory-spotlight"></div>
                  <div class="shockwave-ring"></div>
                  <div class="activity-toast" id="toast-${student.id}">⚡ +1 Commit</div>
                  <div class="nitro-flame"></div>
                  <div class="exhaust"></div>
                  <div class="headlight-beam"></div>
                  ${getUniqueVehicleSVG(student)}
                </div>
              </div>

              <div class="curb"></div>
            </div>

            <div class="finish-gate" id="finish-${student.id}">
              <div class="checkered-strip"></div>
              <span class="gate-label">END</span>
            </div>
          </div>
        `;

        raceContainer.appendChild(row);
      });
    }

    function stopAllAsyncLoops() {
      students.forEach(s => {
        if (s.timerId) {
          clearTimeout(s.timerId);
          s.timerId = null;
        }
      });
    }

    function triggerVictoryDopamine(student) {
      student.isCelebrating = true;
      winnersCount++;
      student.winOrder = winnersCount;

      const vehicleEl = document.getElementById(`vehicle-${student.id}`);
      const roadEl = document.getElementById(`road-${student.id}`);
      const cardEl = document.getElementById(`card-${student.id}`);
      const finishEl = document.getElementById(`finish-${student.id}`);
      const toastEl = document.getElementById(`toast-${student.id}`);

      if (toastEl) {
        toastEl.textContent = student.winOrder === 1
          ? "🥇 1er GAGNANT ! 100% 🎉"
          : "🥈 2e GAGNANT ! 100% 🎉";
      }

      if (vehicleEl) vehicleEl.classList.add("celebrating");
      if (roadEl) roadEl.classList.add("road-victory");
      if (cardEl) cardEl.classList.add("victory-card");
      if (finishEl) finishEl.classList.add("gate-victory");

      setTimeout(() => spawnConfettiAtCar(vehicleEl), 300);
      setTimeout(() => spawnConfettiAtCar(vehicleEl), 1100);
      setTimeout(() => spawnConfettiAtCar(vehicleEl), 2000);

      if (winnersCount >= MAX_WINNERS) {
        raceFinished = true;
        stopAllAsyncLoops();
      }
    }

    function updateStudentDOM(student, showBoost = true) {
      const currentCpInt = Math.floor(student.progress);
      const pct = ((student.progress / 10) * 100).toFixed(1);
      const leftPct = getVehicleLeftPercent(student.progress);

      const statsEl = document.getElementById(`stats-${student.id}`);
      if (statsEl) {
        statsEl.innerHTML = `${currentCpInt}/10 (<span class="pct">${pct}%</span>)`;
      }

      const vehicleEl = document.getElementById(`vehicle-${student.id}`);
      const trailEl = document.getElementById(`trail-${student.id}`);
      const cardEl = document.getElementById(`card-${student.id}`);
      const toastEl = document.getElementById(`toast-${student.id}`);

      if (vehicleEl) {
        vehicleEl.style.left = `${leftPct}%`;

        if (showBoost && !student.isCelebrating) {
          if (toastEl) {
            toastEl.textContent = ACTIVITY_MESSAGES[Math.floor(Math.random() * ACTIVITY_MESSAGES.length)];
          }
          vehicleEl.classList.add("boosting");
          if (cardEl) cardEl.classList.add("is-moving");

          setTimeout(() => {
            vehicleEl.classList.remove("boosting");
            if (cardEl) cardEl.classList.remove("is-moving");
          }, 1100);
        }
      }

      if (trailEl) {
        trailEl.style.width = `${leftPct * 0.94}%`;
      }

      for (let cp = 1; cp <= 10; cp++) {
        const cpEl = document.getElementById(`cp-${student.id}-${cp}`);
        if (!cpEl) continue;
        cpEl.classList.remove("passed", "current");
        if (cp <= currentCpInt) cpEl.classList.add("passed");
        else if (cp === currentCpInt + 1) cpEl.classList.add("current");
      }

      const ranks = getRankings();
      students.forEach((s) => {
        const r = ranks[s.id];
        const rankEl = document.getElementById(`rank-${s.id}`);
        const crownEl = document.getElementById(`crown-${s.id}`);
        if (rankEl) {
          rankEl.textContent = `#${r}`;
          rankEl.classList.toggle("rank-1", r === 1);
          rankEl.classList.toggle("rank-2", r === 2);
        }
        if (crownEl) {
          crownEl.textContent = r === 1 ? "👑" : (r === 2 && s.isCelebrating ? "🥈" : "⚡");
        }
      });
    }

    window.advanceSingleStudent = function(studentId) {
      if (raceFinished) return;
      const student = students.find(s => s.id === studentId);
      if (!student || student.isCelebrating) return;

      const jump = 0.45 + Math.random() * 0.55;
      student.progress = Math.min(10, +(student.progress + jump).toFixed(2));

      if (student.progress >= 10) {
        triggerVictoryDopamine(student);
      }

      updateStudentDOM(student, true);
    };

    function scheduleNextMoveForStudent(student) {
      if (raceFinished || student.isCelebrating) return;
      const randomDelay = student.minDelay + Math.random() * (student.maxDelay - student.minDelay);

      student.timerId = setTimeout(() => {
        if (!raceFinished && !student.isCelebrating) {
          advanceSingleStudent(student.id);
          scheduleNextMoveForStudent(student);
        }
      }, randomDelay);
    }

    function startAllAsyncLoops() {
      students.forEach((student, idx) => {
        setTimeout(() => {
          scheduleNextMoveForStudent(student);
        }, (idx % 10) * 350 + Math.random() * 600);
      });
    }

    function resetAndReplay() {
      stopAllAsyncLoops();
      winnersCount = 0;
      raceFinished = false;
      students.forEach(s => {
        s.progress = s.initialProg;
        s.isCelebrating = false;
        s.winOrder = null;
      });
      renderTracks();
      startAllAsyncLoops();
    }

    document.getElementById("btnReplay").addEventListener("click", resetAndReplay);

    document.getElementById("btnTheme").addEventListener("click", () => {
      document.body.classList.toggle("dark-mode");
    });

    renderTracks();
    startAllAsyncLoops();
  </script>
</body>
